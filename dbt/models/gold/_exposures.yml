version: 2

exposures:
  - name: docs_site
    label: Entity Resolution docs site (GitHub Pages)
    type: dashboard
    maturity: low
    url: https://cbratkovics.github.io/entity-resolution/
    description: >
      The static site under docs/site/ renders the methods table, the reliability plot and the
      review-cost curve from the CSV and JSON files export_gold writes to docs/site/data/. Plain
      HTML and inline SVG; no build step. The dbt docs are published beside it.
    depends_on:
      - ref('fct_eval_metrics')
      - ref('dim_method_version')
    owner:
      name: cbratkovics
      email: cbratkovics@gmail.com
