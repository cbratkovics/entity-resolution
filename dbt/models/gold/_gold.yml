version: 2

models:
  - name: dim_method_version
    description: One row per method version, from the committed method records. The definition, feature version, code commit and tier policy each method's mapping was produced under.
    config:
      contract:
        enforced: true
    columns:
      - name: method_version
        description: The method identifier (exact_v1, rules_v1, learned_v1).
        data_type: varchar
        data_tests:
          - unique
          - not_null
      - name: definition
        description: The method's definition in prose, as written in its record.
        data_type: varchar
      - name: feature_version
        description: FEATURE_VERSION the method was fitted and decided with.
        data_type: varchar
      - name: code_commit
        description: Git commit of the code that fitted the method.
        data_type: varchar
      - name: created_at_utc
        description: When the record was written.
        data_type: timestamp
      - name: auto_accept_min
        description: Calibrated probability at or above which the method auto-accepts.
        data_type: double
      - name: review_min
        description: Calibrated probability at or above which (below auto_accept_min) the method sends to review.
        data_type: double
      - name: ambiguity_gap
        description: Top-two probability gap below which a pair is reviewed regardless of probability.
        data_type: double

  - name: fct_eval_metrics
    description: The results table, one row per method version with every test-fold metric as a column, pivoted verbatim from the evaluation artifacts. Every value reconciles to artifacts/eval_<method_version>.json to 1e-9.
    config:
      contract:
        enforced: true
    columns:
      - name: method_version
        description: The method the row evaluates.
        data_type: varchar
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_method_version')
                field: method_version
      - name: pair_completeness
        description: Share of sampled test-fold truth pairs that blocking produced (union of keys).
        data_type: double
      - name: precision_auto_accept
        description: Precision among auto-accepted pairs.
        data_type: double
      - name: recall_labelled_auto_accept
        description: Recall against labelled pairs at auto_accept.
        data_type: double
      - name: f1_auto_accept
        description: F1 at auto_accept.
        data_type: double
      - name: precision_auto_accept_or_review
        description: Precision if every review were resolved correctly (upper bound).
        data_type: double
      - name: recall_labelled_auto_accept_or_review
        description: Recall against labelled pairs if every review were resolved correctly (upper bound).
        data_type: double
      - name: f1_auto_accept_or_review
        description: F1 at auto_accept plus review (upper bound).
        data_type: double
      - name: recall_overall
        description: recall_labelled_auto_accept multiplied by pair_completeness; blocking loss included.
        data_type: double
      - name: coverage
        description: Accepted A records over all A records in the test fold; a volume measure, not accuracy.
        data_type: double
      - name: coverage_all_folds
        description: Accepted A records over all A records in every fold; not an accuracy measure.
        data_type: double
      - name: tier_share_auto_accept
        description: Share of test-fold A records auto-accepted.
        data_type: double
      - name: tier_share_review
        description: Share of test-fold A records sent to review.
        data_type: double
      - name: tier_share_reject
        description: Share of test-fold A records rejected.
        data_type: double
      - name: ece
        description: Expected calibration error over ten equal-width bins.
        data_type: double
      - name: brier
        description: Brier score of the calibrated probability against the truth label.
        data_type: double
      - name: fold
        description: The fold every metric in the row was computed on; always test.
        data_type: varchar
        data_tests:
          - accepted_values:
              arguments:
                values: ["test"]
