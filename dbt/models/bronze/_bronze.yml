version: 2

models:
  - name: brz_manifest
    description: "artifacts/manifest.json as one typed row. Grain: one row (the current run)."
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: manifest_version
        description: Schema version of the manifest (manifest.schema.json).
      - name: feature_version
        description: FEATURE_VERSION of entity_resolution.features the run was produced with.
      - name: code_commit
        description: Git commit of the code that produced the run; "unknown" on the empty manifest.
      - name: side_a
        description: The side-A source chosen in ADR 0001; null until decided.
      - name: run_id
        description: Identifier of the full-build run; null before the first run.
      - name: updated_at_utc
        description: When the manifest was written.
      - name: n_sources
        description: Number of dumps or endpoints recorded in the manifest.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "n_sources >= 0"

  - name: brz_method_versions
    description: One row per method version record under artifacts/methods/. Grain (method_version). Empty until Phase 4 writes the first record.
    columns:
      - name: source_file
        description: Path of the JSON record the row was read from.
      - name: record_version
        description: Schema version of the record (method_version.schema.json).
      - name: method_version
        description: The method identifier (exact_v1, rules_v1, learned_v1).
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["exact_v1", "rules_v1", "learned_v1"]
      - name: definition
        description: The method's definition in prose, as written in the record.
      - name: feature_version
        description: FEATURE_VERSION the method was fitted and decided with.
      - name: code_commit
        description: Git commit of the code that fitted the method.
      - name: created_at_utc
        description: When the record was written.
      - name: auto_accept_min
        description: Calibrated probability at or above which the method auto-accepts.
      - name: review_min
        description: Calibrated probability at or above which (below auto_accept_min) the method sends to review.
      - name: ambiguity_gap
        description: Top-two probability gap below which a pair is reviewed regardless of probability.

  - name: brz_eval_artifacts
    description: One row per evaluation artifact under artifacts/eval_*.json, nested blocks kept as JSON for silver to flatten. Grain (method_version). Empty until Phase 4 writes the first artifact.
    columns:
      - name: source_file
        description: Path of the JSON artifact the row was read from.
      - name: artifact_version
        description: Schema version of the artifact (eval_artifact.schema.json).
      - name: method_version
        description: The method the artifact evaluates.
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["exact_v1", "rules_v1", "learned_v1"]
      - name: generated_at_utc
        description: When the artifact was written.
      - name: manifest_sha256
        description: sha256 of the manifest the evaluation read its sample from.
      - name: feature_version
        description: FEATURE_VERSION the pair features were computed with.
      - name: code_commit
        description: Git commit of the evaluating code.
      - name: fold_counts
        description: JSON block of A records, B records, candidate pairs and truth pairs per fold.
      - name: metric_definitions
        description: JSON block of prose definitions, one per metric key.
      - name: metrics
        description: JSON block of the test-fold metrics; null until Phase 4 computes them.

  - name: brz_truth_audit
    description: "artifacts/truth_audit.json as one typed row: link counts, the four truth statuses and the one-to-many rates of the current run. Empty until the first full build."
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: audit_version
        description: Schema version of the audit (truth_audit.schema.json).
      - name: generated_at_utc
        description: When the audit was written.
      - name: feature_version
        description: FEATURE_VERSION of the run.
      - name: code_commit
        description: Git commit of the code that produced the run.
      - name: scope_primary_type
        description: The release-group primary type that defines side A's scope (ADR 0001).
      - name: links_raw
        description: Release-group-to-master links read from the dump, before deduplication.
      - name: links_distinct
        description: Distinct (a_id, b_id) links.
      - name: duplicate_links
        description: Links removed as exact duplicates.
      - name: truth_dead
        description: Links whose master is absent from the current Discogs dump.
      - name: truth_out_of_scope
        description: Links whose release group is not of the scope primary type.
      - name: truth_unsampled
        description: Alive in-scope links whose A or B record the hash sample excluded (zero by construction).
      - name: truth_in_sample
        description: Links that are labelled pairs in the sample.
      - name: truth_dead_rate
        description: truth_dead over links_distinct.
      - name: in_sample_pairs
        description: Number of in-sample truth pairs.
      - name: in_sample_a_records
        description: Distinct labelled A records.
      - name: in_sample_b_records
        description: Distinct B records in an in-sample pair.
      - name: one_to_many_a
        description: Labelled A records linked to more than one master.
      - name: one_to_many_a_rate
        description: one_to_many_a over in_sample_a_records.
      - name: one_to_many_b
        description: In-sample masters linked from more than one A record.
      - name: one_to_many_b_rate
        description: one_to_many_b over in_sample_b_records.

  - name: brz_contracts
    description: "artifacts/contracts.json flattened to one row per (side, check). Grain (side, check_name). Empty until the first full build."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [side, check_name]
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: contracts_version
        description: Schema version of the report (contracts.schema.json).
      - name: generated_at_utc
        description: When the report was written.
      - name: report_ok
        description: Whether every check on every side passed.
      - name: side
        description: The source the checks ran on (musicbrainz or discogs).
      - name: side_ok
        description: Whether every check on this side passed.
      - name: rows
        description: Sampled records the checks ran over.
      - name: check_name
        description: The contract (grain_unique, id_format, year_range, null_rates).
        data_tests:
          - accepted_values:
              arguments:
                values: ["grain_unique", "id_format", "year_range", "null_rates"]
      - name: check_ok
        description: Whether this check passed.
