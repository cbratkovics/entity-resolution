version: 2

models:
  - name: brz_manifest
    description: "artifacts/manifest.json as one typed row. Grain: one row (the current run)."
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: manifest_version
        description: Schema version of the manifest (manifest.schema.json).
      - name: feature_version
        description: FEATURE_VERSION of entity_resolution.features the run was produced with.
      - name: code_commit
        description: Git commit of the code that produced the run; "unknown" on the empty manifest.
      - name: side_a
        description: The side-A source chosen in ADR 0001; null until decided.
      - name: run_id
        description: Identifier of the full-build run; null before the first run.
      - name: updated_at_utc
        description: When the manifest was written.
      - name: n_sources
        description: Number of dumps or endpoints recorded in the manifest.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "n_sources >= 0"

  - name: brz_method_versions
    description: One row per method version record under artifacts/methods/. Grain (method_version). Empty until Phase 4 writes the first record.
    columns:
      - name: source_file
        description: Path of the JSON record the row was read from.
      - name: record_version
        description: Schema version of the record (method_version.schema.json).
      - name: method_version
        description: The method identifier (exact_v1, rules_v1, learned_v1).
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["exact_v1", "rules_v1", "learned_v1"]
      - name: definition
        description: The method's definition in prose, as written in the record.
      - name: feature_version
        description: FEATURE_VERSION the method was fitted and decided with.
      - name: code_commit
        description: Git commit of the code that fitted the method.
      - name: created_at_utc
        description: When the record was written.
      - name: auto_accept_min
        description: Calibrated probability at or above which the method auto-accepts.
      - name: review_min
        description: Calibrated probability at or above which (below auto_accept_min) the method sends to review.
      - name: ambiguity_gap
        description: Top-two probability gap below which a pair is reviewed regardless of probability.

  - name: brz_eval_artifacts
    description: One row per evaluation artifact under artifacts/eval_*.json, nested blocks kept as JSON for silver to flatten. Grain (method_version). Empty until Phase 4 writes the first artifact.
    columns:
      - name: source_file
        description: Path of the JSON artifact the row was read from.
      - name: artifact_version
        description: Schema version of the artifact (eval_artifact.schema.json).
      - name: method_version
        description: The method the artifact evaluates.
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["exact_v1", "rules_v1", "learned_v1"]
      - name: generated_at_utc
        description: When the artifact was written.
      - name: manifest_sha256
        description: sha256 of the manifest the evaluation read its sample from.
      - name: feature_version
        description: FEATURE_VERSION the pair features were computed with.
      - name: code_commit
        description: Git commit of the evaluating code.
      - name: fold_counts
        description: JSON block of A records, B records, candidate pairs and truth pairs per fold.
      - name: metric_definitions
        description: JSON block of prose definitions, one per metric key.
      - name: metrics
        description: JSON block of the test-fold metrics; null until Phase 4 computes them.

  - name: brz_truth_audit
    description: "artifacts/truth_audit.json as one typed row: link counts, the four truth statuses and the one-to-many rates of the current run. Empty until the first full build."
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: audit_version
        description: Schema version of the audit (truth_audit.schema.json).
      - name: generated_at_utc
        description: When the audit was written.
      - name: feature_version
        description: FEATURE_VERSION of the run.
      - name: code_commit
        description: Git commit of the code that produced the run.
      - name: scope_primary_type
        description: The release-group primary type that defines side A's scope (ADR 0001).
      - name: links_raw
        description: Release-group-to-master links read from the dump, before deduplication.
      - name: links_distinct
        description: Distinct (a_id, b_id) links.
      - name: duplicate_links
        description: Links removed as exact duplicates.
      - name: truth_dead
        description: Links whose master is absent from the current Discogs dump.
      - name: truth_out_of_scope
        description: Links whose release group is not of the scope primary type.
      - name: truth_unsampled
        description: Alive in-scope links whose A or B record the hash sample excluded (zero by construction).
      - name: truth_in_sample
        description: Links that are labelled pairs in the sample.
      - name: truth_dead_rate
        description: truth_dead over links_distinct.
      - name: in_sample_pairs
        description: Number of in-sample truth pairs.
      - name: in_sample_a_records
        description: Distinct labelled A records.
      - name: in_sample_b_records
        description: Distinct B records in an in-sample pair.
      - name: one_to_many_a
        description: Labelled A records linked to more than one master.
      - name: one_to_many_a_rate
        description: one_to_many_a over in_sample_a_records.
      - name: one_to_many_b
        description: In-sample masters linked from more than one A record.
      - name: one_to_many_b_rate
        description: one_to_many_b over in_sample_b_records.

  - name: brz_contracts
    description: "artifacts/contracts.json flattened to one row per (side, check). Grain (side, check_name). Empty until the first full build."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [side, check_name]
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: contracts_version
        description: Schema version of the report (contracts.schema.json).
      - name: generated_at_utc
        description: When the report was written.
      - name: report_ok
        description: Whether every check on every side passed.
      - name: side
        description: The source the checks ran on (musicbrainz or discogs).
      - name: side_ok
        description: Whether every check on this side passed.
      - name: rows
        description: Sampled records the checks ran over.
      - name: check_name
        description: The contract (grain_unique, id_format, year_range, null_rates).
        data_tests:
          - accepted_values:
              arguments:
                values: ["grain_unique", "id_format", "year_range", "null_rates"]
      - name: check_ok
        description: Whether this check passed.

  - name: brz_blocking_report
    description: "artifacts/blocking_report.json as one row per block key, union figures repeated. Grain (block_key). Empty until the first full build reaches blocking."
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: generated_at_utc
        description: When the report was written.
      - name: feature_version
        description: FEATURE_VERSION the keys were emitted with.
      - name: code_commit
        description: Git commit of the code that produced the run.
      - name: block_key
        description: The blocking key (k_title3, k_artist_year, k_title_sorted, k_phonetic, k_self_titled).
        data_tests:
          - unique
          - not_null
      - name: key_pairs
        description: Candidate pairs this key produced on its own, before the union.
      - name: key_pair_completeness
        description: Share of sampled truth pairs this key recovers on its own.
      - name: keys_emitted_a
        description: Key values emitted by side-A records for this key.
      - name: keys_emitted_b
        description: Key values emitted by side-B records for this key.
      - name: union_pairs
        description: Distinct candidate pairs in the union of every key, before the per-A cap.
      - name: candidate_pairs_after_cap
        description: Candidate pairs kept after the per-A cap.
      - name: reduction_ratio
        description: One minus candidate pairs after the cap over the A times B cross product.
      - name: union_pair_completeness
        description: Share of sampled truth pairs recovered by the union, before the cap.
      - name: after_cap_pair_completeness
        description: Share of sampled truth pairs still present after the per-A cap.
      - name: truth_pairs
        description: Sampled truth pairs the completeness figures are measured against.
      - name: truth_pairs_lost_to_cap
        description: Truth pairs in the union that the per-A cap removed.
      - name: a_records_over_cap
        description: A records whose union candidates exceeded the cap.
      - name: pairs_dropped
        description: Candidate pairs removed by the cap.
      - name: candidate_cap_per_a
        description: The per-A candidate cap.

  - name: brz_split
    description: "artifacts/split.json as one row per fold (ADR 0003: folds by the A record). Grain (fold). Empty until the first full build reaches the split."
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: generated_at_utc
        description: When the split was written.
      - name: feature_version
        description: FEATURE_VERSION of the run.
      - name: code_commit
        description: Git commit of the code that produced the run.
      - name: rule
        description: The fold rule in words.
      - name: fold
        description: The fold (fit, calibrate, test).
        data_tests:
          - unique
          - not_null
          - accepted_values:
              arguments:
                values: ["fit", "calibrate", "test"]
      - name: bucket_low
        description: Lowest hash bucket (inclusive) assigned to the fold.
      - name: bucket_high
        description: Highest hash bucket (exclusive) assigned to the fold.
      - name: a_records
        description: Sampled A records in the fold.
      - name: labelled_a_records
        description: Labelled A records in the fold.
      - name: truth_pairs
        description: In-sample truth pairs whose A record is in the fold.
      - name: candidate_pairs
        description: Candidate pairs whose A record is in the fold.

  - name: brz_review_sensitivity
    description: "artifacts/review_sensitivity.json flattened to one row per (method_version, threshold, cost_ratio): the review-cost curve on the test fold. Empty until the first full build reaches the methods stage."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [method_version, threshold, cost_ratio]
    columns:
      - name: source_file
        description: Path of the JSON file the row was read from.
      - name: generated_at_utc
        description: When the sweep was written.
      - name: feature_version
        description: FEATURE_VERSION of the run.
      - name: code_commit
        description: Git commit of the code that produced the run.
      - name: method_version
        description: The method the curve belongs to.
      - name: review_min
        description: The method's review lower bound.
      - name: chosen_accept_threshold
        description: The method's chosen auto-accept threshold, reported beside the curve.
      - name: threshold
        description: The swept accept threshold (0.50 to 0.99).
      - name: accepts
        description: Test-fold A records accepted at this threshold.
      - name: review_queue
        description: Test-fold A records between review_min and the threshold.
      - name: precision_labelled
        description: Precision at this threshold over labelled test-fold decisions.
      - name: expected_false_accepts
        description: accepts times one minus precision_labelled.
      - name: cost_ratio
        description: Cost of one false accept relative to one review row (1, 5 or 20).
      - name: total_cost
        description: review_queue plus expected_false_accepts times cost_ratio, in review-row units.

  - name: brz_mapping
    description: "The committed mapping exhibits: test-fold A records with a non-reject decision, one row per (a_id, method_version) (ADR 0005). Identifiers and numbers only. Empty until the first full build reaches the methods stage."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [a_id, method_version]
    columns:
      - name: source_file
        description: Path of the CSV file the row was read from.
      - name: a_id
        description: Side-A native id (MusicBrainz release group gid).
      - name: b_id
        description: The decided side-B native id (Discogs master id).
      - name: method_version
        description: The method that made the decision.
        data_tests:
          - accepted_values:
              arguments:
                values: ["exact_v1", "rules_v1", "learned_v1"]
      - name: feature_version
        description: FEATURE_VERSION the pair features were computed with.
      - name: score
        description: The method's raw score for the decided pair.
      - name: probability
        description: The probability the tier was assigned on (calibrated for learned_v1, raw otherwise).
      - name: tier
        description: auto_accept or review (reject rows are not in the exhibit).
        data_tests:
          - accepted_values:
              arguments:
                values: ["auto_accept", "review"]
      - name: block_keys
        description: The blocking keys that produced the decided pair, joined by a pipe.
      - name: top2_gap
        description: Probability gap between the decided candidate and the runner-up; null with a single candidate.
      - name: fold
        description: The A record's fold; always test in the exhibit.
        data_tests:
          - accepted_values:
              arguments:
                values: ["test"]
      - name: run_id
        description: Identifier of the full-build run.
      - name: decided_at_utc
        description: When the decision was written.
