version: 2

# Every source is a committed artifact under artifacts/. dbt-duckdb reads them in place through
# `external_location`; bronze models copy them into warehouse tables so silver and gold never
# touch files. Paths are relative to the repo root. Artifact families that do not exist yet (no
# run has happened) are guarded by the files_exist macro in their bronze model.
sources:
  - name: artifacts
    description: >
      JSON and CSV artifacts committed under artifacts/ by the full build: the manifest, the
      method version records and the per-method evaluation artifacts. Identifiers, hashes,
      parameters and metrics only; no record attributes.
    loader: entity_resolution (make full)
    meta:
      owner: "cbratkovics"
    tables:
      - name: manifest
        description: artifacts/manifest.json — the dumps, sample rule and counts of the current run (schema manifest.schema.json).
        meta:
          formatter: template
          external_location: "read_json_auto('{{ var('artifacts_dir') }}/manifest.json', filename = true)"

      - name: method_versions
        description: artifacts/methods/<method_version>.json — one record per method (schema method_version.schema.json).
        meta:
          formatter: template
          external_location: "read_json_auto('{{ var('artifacts_dir') }}/methods/*.json', filename = true, union_by_name = true)"

      - name: eval_artifacts
        description: artifacts/eval_<method_version>.json — one evaluation artifact per method on the test fold (schema eval_artifact.schema.json). Every published number comes from these files.
        meta:
          formatter: template
          external_location: "read_json_auto('{{ var('artifacts_dir') }}/eval_*.json', filename = true, union_by_name = true)"

      - name: truth_audit
        description: artifacts/truth_audit.json — link counts, the four truth statuses, one-to-many rates and hashed anomaly samples of the current run (schema truth_audit.schema.json).
        meta:
          formatter: template
          external_location: "read_json_auto('{{ var('artifacts_dir') }}/truth_audit.json', filename = true)"

      - name: contracts
        description: artifacts/contracts.json — the data-contract report over both sampled sides (schema contracts.schema.json).
        meta:
          formatter: template
          external_location: "read_json_auto('{{ var('artifacts_dir') }}/contracts.json', filename = true)"

      - name: blocking_report
        description: artifacts/blocking_report.json — per-key and union pair completeness, candidate counts, reduction ratio and cap overflow of the current run (schema blocking_report.schema.json).
        meta:
          formatter: template
          external_location: "read_json_auto('{{ var('artifacts_dir') }}/blocking_report.json', filename = true)"

      - name: split
        description: artifacts/split.json — the fold rule (ADR 0003) and counts per fold of the current run (schema split.schema.json).
        meta:
          formatter: template
          external_location: "read_json_auto('{{ var('artifacts_dir') }}/split.json', filename = true)"
