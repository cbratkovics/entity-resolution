# entity_resolution_dbt — medallion warehouse over the repository's own committed artifacts.
# bronze: typed one-to-one copies of the artifact files; silver: cleaned, grain-enforced, long
# metric tables; gold: contracted marts the docs site reads. Bronze reads only committed
# artifacts, so `dbt build` runs in slim CI without any download (docs/BRIEF.md 2.10).
name: entity_resolution_dbt
version: "1.0.0"
config-version: 2
require-dbt-version: ">=1.9.0"

profile: entity_resolution_dbt

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
analysis-paths: ["analyses"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Project vocabulary, mirrored from entity_resolution/config.py (PROJECT);
  # tests/test_project_config.py fails when these defaults diverge from config.dbt_vars().
  method_versions: [exact_v1, rules_v1, learned_v1]
  folds: [fit, calibrate, test]
  tiers: [auto_accept, review, reject]
  # Every path is relative to the repository root; run dbt from there (Makefile, CI).
  artifacts_dir: artifacts

models:
  entity_resolution_dbt:
    +materialized: table
    bronze:
      +schema: bronze
      +tags: ["bronze"]
    silver:
      +schema: silver
      +tags: ["silver"]
    gold:
      +schema: gold
      +tags: ["gold"]
      +contract:
        enforced: true

tests:
  entity_resolution_dbt:
    +store_failures: false
