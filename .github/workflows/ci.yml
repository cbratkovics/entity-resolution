name: ci

# Offline CI on every push and pull request (docs/BRIEF.md 2.12, target under 10 minutes):
# frozen install, lint, the pytest suite (real-data tests skip), a dbt build against the
# committed artifacts, the description / number / card checks, and the smoke test from a fresh
# clone. No network beyond package downloads, no secrets, no paid service. The full build over
# the real dumps lives in full-build.yml; the site is published by pages.yml. The `lab` job
# checks the Decision Lab export (ADR 0006), type-checks, unit-tests, builds and browser-tests
# the app at its Pages base path.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG: entity_resolution

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Cache dbt packages
        uses: actions/cache@v5
        with:
          path: dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('dbt/packages.yml', 'dbt/package-lock.yml') }}
      - name: Setup (uv sync --frozen + dbt deps)
        run: make setup
      - name: Lint (ruff check, ruff format --check, sqlfluff)
        run: make lint
      - name: Tests (offline; real-data tests skip without data/)
        run: make test
      - name: dbt deps + build against the committed artifacts + docs generate + descriptions
        run: make dbt
      - name: Every measured number in the docs resolves to an artifact key
        run: .venv/bin/python scripts/check_numbers.py
      - name: Methods card matches the artifacts and carries no placeholder
        run: .venv/bin/python scripts/check_model_card.py
      - name: Decision Lab export is current and internally consistent (no rewrite)
        run: make lab-check
      - name: Smoke test from a fresh clone in a temp dir
        run: bash scripts/smoke.sh

  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version-file: apps/decision-lab/.nvmrc
          cache: npm
          cache-dependency-path: apps/decision-lab/package-lock.json
      - name: Install (npm ci, lockfile frozen)
        run: npm ci
        working-directory: apps/decision-lab
      - name: Sync the committed lab export into the app
        run: npm run sync-data
        working-directory: apps/decision-lab
      - name: Type check
        run: npm run typecheck
        working-directory: apps/decision-lab
      - name: Lint
        run: npm run lint
        working-directory: apps/decision-lab
      - name: Unit tests (policy parity with the Python fixtures, ledger, validators)
        run: npm test
        working-directory: apps/decision-lab
      - name: Build at the Pages base path and report sizes
        run: npm run build && npm run size
        working-directory: apps/decision-lab
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium
        working-directory: apps/decision-lab
      - name: Browser journeys against the built app at /entity-resolution/lab/
        run: npm run test:e2e
        working-directory: apps/decision-lab
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/decision-lab/playwright-report
          retention-days: 7
