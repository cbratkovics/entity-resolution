name: full-build

# The full build over the real dumps (docs/BRIEF.md 2.12): download the dumps, verify their
# sha256 against the committed manifest (fail on mismatch unless refresh=true), run `make full`,
# run the real-data tests, upload artifacts/ as a workflow artifact and print a diff against the
# committed artifacts. It commits nothing: the owner reviews and commits. May run one to two
# hours once the pipeline exists; until Phase 2 the download and verify steps are stubs and
# `make full` exits with the phase it is waiting for.

on:
  workflow_dispatch:
    inputs:
      refresh:
        description: "Accept dumps whose sha256 differs from the committed manifest"
        type: boolean
        default: false
  schedule:
    - cron: "0 6 1 * *"  # monthly, the 1st at 06:00 UTC

permissions:
  contents: read

concurrency:
  group: full-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PKG: entity_resolution
      ENTITY_RESOLUTION_DUCKDB_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Setup (uv sync --frozen + dbt deps)
        run: make setup
      - name: Download the dumps (stub until Phase 2 adds the adapters)
        run: |
          mkdir -p data
          echo "download: not implemented before Phase 2 (docs/BRIEF.md section 3); nothing fetched"
      - name: Verify dump sha256 against the committed manifest (stub until Phase 2)
        env:
          REFRESH: ${{ inputs.refresh }}
        run: |
          echo "verify: manifest lists $(.venv/bin/python -c 'import json; print(len(json.load(open("artifacts/manifest.json"))["sources"]))') sources; refresh=${REFRESH:-false}"
      - name: make full
        id: full
        continue-on-error: true
        run: make full
      - name: Real-data tests
        if: ${{ steps.full.outcome == 'success' }}
        run: make test
      - name: Diff fresh artifacts against the committed ones
        run: git --no-pager diff --stat -- artifacts || true
      - name: Upload artifacts/
        uses: actions/upload-artifact@v4
        with:
          name: full-build-${{ github.run_id }}
          path: artifacts
      - name: Report the pipeline status
        run: |
          if [ "${{ steps.full.outcome }}" != "success" ]; then
            echo "make full did not complete: the pipeline is not built yet (see the step log)"; exit 1
          fi
