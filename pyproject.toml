[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "entity_resolution"
version = "0.1.0"
description = "Record linkage between open music catalogues, measured against labelled ground truth."
requires-python = ">=3.12"
readme = "README.md"
# Runtime = the pipeline and the warehouse. dbt is a runtime dependency because `make full` and
# `make dbt` both run it; the toolchain pins (dbt-core, dbt-duckdb, duckdb) are exact so the local
# build, CI and the full build run the same engine. Every other floor is resolved by uv.lock.
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "rapidfuzz>=3.9",
  "jsonschema>=4",
  "pyyaml>=6",
  "duckdb==1.5.5",
  "dbt-core==1.12.4",
  "dbt-duckdb==1.11.0",
  "metaphone>=0.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "sqlfluff>=3.0",
  "sqlfluff-templater-dbt>=3.0",
]

[tool.setuptools.packages.find]
include = ["entity_resolution*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
